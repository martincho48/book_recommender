# Deploys the app to Cloud Run after a push to main that changes the app (or by hand: Actions -> Deploy -> Run workflow).
# Login to GCP without keys (Workload Identity Federation) – GCP accepts only this repository and branch main.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - app/app.py
      - app/test_app.py
      - app/static/**
      - requirements_docker.txt
      - Dockerfile
      - .dockerignore
      - .streamlit/**
      - .github/workflows/deploy.yml
  workflow_dispatch:            # after new data was uploaded to the bucket

permissions:
  contents: read
  id-token: write               # the token GCP checks in the federation

concurrency:
  group: deploy                 # one deployment at a time
  cancel-in-progress: false

env:
  PROJECT_ID: book-recommender-512711
  REGION: europe-west1
  SERVICE: book-recommender
  IMAGE: europe-west1-docker.pkg.dev/book-recommender-512711/book-recommender/app:${{ github.sha }}
  BUCKET: gs://book-recommender-512711-data

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/497923768669/locations/global/workloadIdentityPools/github/providers/github-repo
          service_account: github-deployer@book-recommender-512711.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Data from the bucket
        run: |
          mkdir -p data/processed
          gcloud storage cp "$BUCKET/books.parquet" "$BUCKET/similar_books.parquet" data/processed/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Test the app with the real data
        run: |
          pip install -r requirements_docker.txt pytest
          pytest app/test_app.py

      - name: Build and push the image
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run (with the cost limits)
        run: |
          gcloud run deploy "$SERVICE" --image "$IMAGE" --region "$REGION" --project "$PROJECT_ID" \
            --service-account book-recommender-run@book-recommender-512711.iam.gserviceaccount.com \
            --allow-unauthenticated --min-instances 0 --max-instances 1 --timeout 300 \
            --cpu 1 --memory 1Gi --quiet
          gcloud run services describe "$SERVICE" --region "$REGION" --format "value(status.url)"
